apiVersion: apps/v1
kind: Deployment
metadata:
  name: dq-api
  labels:
    app.kubernetes.io/name: dq-api
    app.kubernetes.io/part-of: dq-made-easy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dq-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-api
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      volumes:
        - name: platform-root-ca
          configMap:
            name: platform-root-ca
      containers:
        - name: dq-api
          image: docker.io/jacbeekers/dq-made-easy-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4010
              name: http
          env:
            - name: API_HTTPS_ENABLED
              value: "false"
            - name: CURL_CA_BUNDLE
              value: /etc/ssl/certs/platform-root-ca.pem
            - name: SSO_INTERNAL_ISSUER_URL
              valueFrom:
                configMapKeyRef:
                  name: dq-api-config
                  key: SSO_INTERNAL_ISSUER_URL
                  optional: true
          envFrom:
            - configMapRef:
                name: dq-common-config
            - configMapRef:
                name: dq-api-config
            - secretRef:
                name: redis-credential-api
          volumeMounts:
            - name: platform-root-ca
              mountPath: /etc/ssl/certs/platform-root-ca.pem
              subPath: rootCA.pem
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dq-api
  labels:
    app.kubernetes.io/name: dq-api
    app.kubernetes.io/part-of: dq-made-easy
spec:
  selector:
    app.kubernetes.io/name: dq-api
  ports:
    - name: http
      port: 4010
      targetPort: http