apiVersion: apps/v1
kind: Deployment
metadata:
  name: dq-engine
  labels:
    app.kubernetes.io/name: dq-engine
    app.kubernetes.io/part-of: dq-made-easy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dq-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-engine
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      volumes:
        - name: platform-root-ca
          configMap:
            name: platform-root-ca
      containers:
        - name: dq-engine
          image: docker.io/jacbeekers/dq-made-easy-engine:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: dq-common-config
            - configMapRef:
                name: dq-engine-config
            - secretRef:
                name: dq-engine-secrets
          volumeMounts:
            - name: platform-root-ca
              mountPath: /etc/ssl/certs/platform-root-ca.pem
              subPath: rootCA.pem
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dq-engine
  labels:
    app.kubernetes.io/name: dq-engine
    app.kubernetes.io/part-of: dq-made-easy
spec:
  selector:
    app.kubernetes.io/name: dq-engine
  ports:
    - name: http
      port: 8000
      targetPort: http