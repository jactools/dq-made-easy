apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dq-engine
spec:
  tls:
    - hosts:
        - dq-engine.jacloud.nl
      secretName: dq-engine.jacloud.nl-tls
  rules:
    - host: dq-engine.jacloud.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dq-engine
                port:
                  number: 8000