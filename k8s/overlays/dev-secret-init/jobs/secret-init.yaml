apiVersion: v1
kind: ServiceAccount
metadata:
  name: dq-secret-init-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dq-secret-init-role
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["create", "update", "patch", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dq-secret-init-binding
subjects:
  - kind: ServiceAccount
    name: dq-secret-init-sa
    namespace: dq-dev
roleRef:
  kind: Role
  name: dq-secret-init-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dq-secret-init
spec:
  template:
    spec:
      serviceAccountName: dq-secret-init-sa
      restartPolicy: Never
      containers:
        - name: generate-secrets
          image: bitnami/kubectl:latest
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/sh
            - -ec
            - |
              gen() { openssl rand -base64 32 | tr -d '\n'; }
              # Fernet key is base64url-encoded 32 random bytes (must end with =)
              fernet_key() { openssl rand 32 | base64 | tr '+/' '-_' | tr -d '\n'; }

              # Helper: create secret with --dry-run=client
              ensure_secret() {
                local name="$1"; shift
                kubectl create secret generic "$name" \
                  --dry-run=client -o yaml \
                  "$@" | kubectl apply -f - -n "$NAMESPACE"
              }

              # Helper: create secret only if it doesn't already exist (idempotent)
              ensure_secret_if_missing() {
                local name="$1"; shift
                if kubectl get secret "$name" -n "$NAMESPACE" >/dev/null 2>&1; then
                  echo "  $name: exists (skipped)"
                  return 0
                fi
                kubectl create secret generic "$name" \
                  --dry-run=client -o yaml \
                  "$@" | kubectl apply -f - -n "$NAMESPACE"
                echo "  $name: created"
              }

              # Helper: generate self-signed TLS secret
              ensure_tls() {
                local name="$1" cn="$2"
                local tmp
                tmp=$(mktemp -d)
                openssl req -x509 -newkey rsa:2048 -keyout "$tmp/key.pem" -out "$tmp/cert.pem" \
                  -days 365 -nodes -subj "/CN=$cn" \
                  -addext "subjectAltName=DNS:$cn,DNS:localhost,IP:127.0.0.1" 2>/dev/null
                kubectl -n "$NAMESPACE" create secret tls "$name" \
                  --cert="$tmp/cert.pem" --key="$tmp/key.pem" \
                  --dry-run=client -o yaml | kubectl apply -f -
                rm -rf "$tmp"
              }

              # TLS secrets (self-signed for dev)
              ensure_tls "dq-api-tls" "dq-api.dev.jac.dot"
              ensure_tls "dq-engine-tls" "dq-engine.dev.jac.dot"
              # UI ingress TLS: prefer the platform-CA-signed cert injected by
              # platform bootstrap (kind.sh inject_tls_certs_local); fall back
              # to a self-signed cert if it is missing
              if kubectl get secret "dq-made-easy.dev.jac.dot-tls" -n "$NAMESPACE" >/dev/null 2>&1; then
                echo "  dq-made-easy.dev.jac.dot-tls: exists (kept)"
              else
                ensure_tls "dq-made-easy.dev.jac.dot-tls" "dq-made-easy.dev.jac.dot"
                echo "  dq-made-easy.dev.jac.dot-tls: created (self-signed fallback)"
              fi
              # Frontend uses a generic secret (not kubernetes.io/tls)
              tmp2=$(mktemp -d)
              openssl req -x509 -newkey rsa:2048 -keyout "$tmp2/key.pem" -out "$tmp2/cert.pem" \
                -days 365 -nodes -subj "/CN=dq-made-easy.dev.jac.dot" \
                -addext "subjectAltName=DNS:dq-made-easy.dev.jac.dot,DNS:localhost,IP:127.0.0.1" 2>/dev/null
              ensure_secret "dq-dev-tls-cert" \
                --from-file=tls.crt="$tmp2/cert.pem" \
                --from-file=tls.key="$tmp2/key.pem"
              rm -rf "$tmp2"

              # DB secrets (idempotent — only create if missing to preserve existing data)
              ensure_secret_if_missing "dq-db-secrets" \
                --from-literal=POSTGRES_PASSWORD="$(gen)" \
                --from-literal=POSTGRES_USER=postgres \
                --from-literal=POSTGRES_DB=dq

              # API secrets (URL-encode password for / and special chars)
              # Idempotent — preserves existing Fernet key and URL
              db_pw=$(kubectl get secret dq-db-secrets -n "$NAMESPACE" -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)
              db_pw_enc=$(echo -n "$db_pw" | sed 's|/|%2F|g; s|+|%2B|g; s|=|%3D|g')
              ensure_secret_if_missing "dq-api-secrets" \
                --from-literal=DQ_DB_INTERNAL_URL="postgresql://postgres:${db_pw_enc}@dq-db.$NAMESPACE.svc.cluster.local:5432/dq" \
                --from-literal=DQ_DB_LOCAL_URL="postgresql://postgres:${db_pw_enc}@dq-db.$NAMESPACE.svc.cluster.local:5432/dq" \
                --from-literal=API_SECRET_PLACEHOLDER="$(gen)" \
                --from-literal=APP_CONFIG_ENCRYPTION_KEY="$(fernet_key)"

              # Frontend secrets
              ensure_secret_if_missing "dq-frontend-secrets" \
                --from-literal=FRONTEND_SECRET_PLACEHOLDER="$(gen)"

              # CA bundle: copy from platform-root-ca to dq-platform-ca-bundle
              if kubectl get configmap platform-root-ca -n "$NAMESPACE" >/dev/null 2>&1; then
                ca_pem=$(kubectl get configmap platform-root-ca -n "$NAMESPACE" -o jsonpath='{.data.rootCA\.pem}')
                kubectl create configmap dq-platform-ca-bundle -n "$NAMESPACE" \
                  --from-literal=ca-bundle.pem="$ca_pem" \
                  --dry-run=client -o yaml | kubectl apply -f -
                echo "  dq-platform-ca-bundle: synced from platform-root-ca"
              else
                echo "  WARNING: platform-root-ca not found, skipping dq-platform-ca-bundle"
              fi

              # DB seed - run alembic migrations and seed data
              ensure_secret "dq-db-seed-config" \
                --from-literal=PGHOST=dq-db.$NAMESPACE.svc.cluster.local \
                --from-literal=PGPORT=5432 \
                --from-literal=PGUSER=postgres \
                --from-literal=PGDATABASE=dq \
                --from-literal=DATABASE_SCHEMA=dq \
                --from-literal=REQUIRE_DATABASE=true
