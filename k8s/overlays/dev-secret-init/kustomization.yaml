# DQ secret-init — generates secrets before main deployment
# Flux ordering: dq-secret-init → dq-made-easy → dq-api-migrate

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dq-dev

resources:
  - ../base/shared/namespace.yaml
  - ../jobs/secret-init.yaml

labels:
  - includeSelectors: true
    pairs:
      platform.jaccloud.nl/managed-by: argocd
      platform.jaccloud.nl/tenant: dq
      platform.jaccloud.nl/environment: dev
