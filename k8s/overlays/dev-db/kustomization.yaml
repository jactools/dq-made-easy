apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dq-dev

resources:
  - ../../../infra/k8s/base/shared/namespace.yaml
  - ../../../infra/k8s/base/shared/config/common-config.yaml
  - ../../../infra/k8s/base/api/db.yaml
  - ../../../infra/k8s/base/api/db-config.yaml
  # secret-init job moved to the dev-secret-init overlay (Flux gates this
  # stage on that Kustomization completing first)
  - ../dev-secret-init/jobs

nameSuffix: ""

patches:
  - target:
      kind: Namespace
      name: dq-made-easy
    patch: |
      - op: replace
        path: /metadata/name
        value: dq-dev
  - path: patches/common-config.yaml

labels:
  - includeSelectors: true
    pairs:
      platform.jaccloud.nl/managed-by: flux
      platform.jaccloud.nl/tenant: dq-made-easy
      platform.jaccloud.nl/environment: dev

images:
  - name: docker.io/jacbeekers/dq-made-easy-db
    newName: jacloud.nl/docker/jacbeekers/dq-made-easy-db
    newTag: "0.11"

