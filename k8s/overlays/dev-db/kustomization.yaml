apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dq-dev

resources:
  # Base resources are inlined (copies of infra/k8s/base/{shared,api}) so the
  # overlay is self-contained: kustomize rejects individual-file references
  # outside the build root. Environment overrides go through patches/ and the
  # namespace transformer.
  - namespace.yaml
  - common-config.yaml
  - db.yaml
  - db-config.yaml
  # secret-init job lives in the dev-secret-init overlay (Flux gates this
  # stage on that Kustomization completing first)
  - ../dev-secret-init/jobs

nameSuffix: ""

patches:
  - target:
      kind: Namespace
      name: dq-made-easy
    patch: |
      - op: replace
        path: /metadata/name
        value: dq-dev
  - path: patches/common-config.yaml

labels:
  - includeSelectors: true
    pairs:
      platform.jaccloud.nl/managed-by: flux
      platform.jaccloud.nl/tenant: dq-made-easy
      platform.jaccloud.nl/environment: dev

images:
  - name: docker.io/jacbeekers/dq-made-easy-db
    newName: jacloud.nl/docker/jacbeekers/dq-made-easy-db
    newTag: "0.11"

