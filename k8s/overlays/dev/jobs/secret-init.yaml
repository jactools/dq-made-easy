apiVersion: v1
kind: ServiceAccount
metadata:
  name: dq-secret-init-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dq-secret-init-role
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dq-secret-init-binding
subjects:
  - kind: ServiceAccount
    name: dq-secret-init-sa
    namespace: dq-dev
roleRef:
  kind: Role
  name: dq-secret-init-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: dq-secret-init
spec:
  template:
    spec:
      serviceAccountName: dq-secret-init-sa
      restartPolicy: Never
      containers:
        - name: generate-secrets
          image: bitnami/kubectl:latest
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/sh
            - -ec
            - |
              gen() { openssl rand -base64 32 | tr -d '\n'; }
              # Fernet key is base64url-encoded 32 random bytes (must end with =)
              fernet_key() { openssl rand 32 | base64 | tr '+/' '-_' | tr -d '\n'; }

              # Helper: create secret with --dry-run=client
              ensure_secret() {
                local name="$1"; shift
                kubectl create secret generic "$name" \
                  --dry-run=client -o yaml \
                  "$@" | kubectl apply -f - -n "$NAMESPACE"
              }

              # DB secrets
              ensure_secret "dq-db-secrets" \
                --from-literal=POSTGRES_PASSWORD="$(gen)" \
                --from-literal=POSTGRES_USER=postgres \
                --from-literal=POSTGRES_DB=dq

              # API secrets
              ensure_secret "dq-api-secrets" \
                --from-literal=DQ_DB_INTERNAL_URL="postgresql://postgres:$(kubectl get secret dq-db-secrets -n "$NAMESPACE" -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)@dq-db.$NAMESPACE.svc.cluster.local:5432/dq" \
                --from-literal=DQ_DB_LOCAL_URL="postgresql://postgres:$(kubectl get secret dq-db-secrets -n "$NAMESPACE" -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)@dq-db.$NAMESPACE.svc.cluster.local:5432/dq" \
                --from-literal=API_SECRET_PLACEHOLDER="$(gen)" \
                --from-literal=APP_CONFIG_ENCRYPTION_KEY="$(fernet_key)"

              # Frontend secrets
              ensure_secret "dq-frontend-secrets" \
                --from-literal=FRONTEND_SECRET_PLACEHOLDER="$(gen)"

              # DB seed - run alembic migrations and seed data
              ensure_secret "dq-db-seed-config" \
                --from-literal=PGHOST=dq-db.$NAMESPACE.svc.cluster.local \
                --from-literal=PGPORT=5432 \
                --from-literal=PGUSER=postgres \
                --from-literal=PGDATABASE=dq \
                --from-literal=DATABASE_SCHEMA=dq \
                --from-literal=REQUIRE_DATABASE=true
