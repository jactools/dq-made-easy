apiVersion: batch/v1
kind: Job
metadata:
  name: dq-job-api-migrate
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: api-migrate
          image: docker-registry.dev.jac.dot:5000/jacbeekers/dq-made-easy-api:0.11
          envFrom:
            - configMapRef:
                name: dq-common-config
            - configMapRef:
                name: dq-api-config
            - secretRef:
                name: redis-credential-api
            - secretRef:
                name: dq-api-secrets
            - secretRef:
                name: dq-db-secrets
          command:
            - /bin/sh
            - -ec
            - |
              # Wait for database to be ready (using Python psycopg, not psql)
              for i in $(seq 1 10); do
                if python -c "import psycopg; psycopg.connect('$DQ_DB_INTERNAL_URL').close()" 2>/dev/null; then
                  echo "Database is ready"
                  break
                fi
                if [ $i -eq 10 ]; then
                  echo "Database not ready after 10 attempts"
                  exit 1
                fi
                sleep 2
              done
              cd /app && python -m alembic -c alembic.ini upgrade heads
