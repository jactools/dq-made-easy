apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dq-dev

resources:
  - ../../base
  - config/dq-api-config.yaml
  - config/dq-frontend-config.yaml
  - config/dq-engine-config.yaml
  - external-secrets/redis-credential-api.yaml
  - external-secrets/redis-credential-engine.yaml
  - jobs/secret-init.yaml

labels:
  - includeSelectors: true
    pairs:
      platform.jaccloud.nl/managed-by: argocd
      platform.jaccloud.nl/tenant: dq
      platform.jaccloud.nl/environment: dev

patches:
  - target:
      kind: Namespace
      name: dq-made-easy
    patch: |-
      - op: replace
        path: /metadata/name
        value: dq-dev
      - op: add
        path: /metadata/labels/platform.jaccloud.nl~1managed-by
        value: argocd
      - op: add
        path: /metadata/labels/platform.jaccloud.nl~1tenant
        value: dq
      - op: add
        path: /metadata/labels/platform.jaccloud.nl~1environment
        value: dev
  - path: patches/common-config.yaml
  - path: patches/keycloak-config.yaml
  - path: patches/kong-config.yaml
  - path: patches/ingress-dq-api.yaml
  - path: patches/ingress-dq-ui.yaml
  - path: patches/ingress-dq-engine.yaml
  # Deployments sync after PreSync hooks create secrets
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "10"
  - target:
      kind: Service
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "5"
  - target:
      kind: Ingress
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "15"

images:
  - name: docker.io/jacbeekers/dq-made-easy-api
    newName: docker-registry.dev.jac.dot:5000/jacbeekers/dq-made-easy-api
    newTag: "0.11"
  - name: docker.io/jacbeekers/dq-made-easy-db
    newName: docker-registry.dev.jac.dot:5000/jacbeekers/dq-made-easy-db
    newTag: "0.11"
  - name: docker.io/jacbeekers/dq-made-easy-frontend
    newName: docker-registry.dev.jac.dot:5000/jacbeekers/dq-made-easy-frontend
    newTag: "0.11"
  - name: docker.io/jacbeekers/dq-made-easy-engine
    newName: docker-registry.dev.jac.dot:5000/jacbeekers/dq-made-easy-engine
    newTag: "0.11"