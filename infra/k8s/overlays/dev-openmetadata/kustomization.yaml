apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dq-made-easy-dev

resources:
  - ../../base/openmetadata
  - config/service-config.yaml

labels:
  - includeSelectors: true
    pairs:
      platform.jaccloud.nl/managed-by: argocd
      platform.jaccloud.nl/tenant: dq-made-easy
      platform.jaccloud.nl/environment: dev

images:
  - name: docker.io/jacbeekers/dq-made-easy-openmetadata-db
    newName: docker-registry.dev.jac.dot:5000/jacbeekers/dq-made-easy-openmetadata-db
    newTag: "0.11"
  - name: docker.io/jacbeekers/dq-made-easy-openmetadata
    newName: docker-registry.dev.jac.dot:5000/jacbeekers/dq-made-easy-openmetadata-server
    newTag: "0.11"
