apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dq-made-easy-dev

resources:
  - ../../base/kafka-consumer
  - config/service-config.yaml

labels:
  - includeSelectors: true
    pairs:
      platform.jaccloud.nl/managed-by: argocd
      platform.jaccloud.nl/tenant: dq-made-easy
      platform.jaccloud.nl/environment: dev

images:
  - name: docker.io/jacbeekers/dq-made-easy-kafka-consumer
    newName: docker-registry.dev.jac.dot:5000/jacbeekers/dq-made-easy-kafka-consumer
    newTag: "0.11"
