apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dq-made-easy-dev

resources:
  - ../../base/shared
  - ../../base/engine
  - config/service-config.yaml
  - config/service-secrets-placeholder.yaml

patches:
  - path: namespace-patch.yaml
  - path: common-config-patch.yaml

replicas:
  - name: dq-engine
    count: 1
  - name: dq-profiling
    count: 1
  - name: dq-llm
    count: 1
  - name: dq-openmetadata-db
    count: 1
  - name: dq-openmetadata-server
    count: 1
  - name: dq-kafka-consumer
    count: 1
