apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dq-made-easy-dev

resources:
  - ../../base/engine

labels:
  - includeSelectors: true
    pairs:
      platform.jaccloud.nl/managed-by: argocd
      platform.jaccloud.nl/tenant: dq-made-easy
      platform.jaccloud.nl/environment: dev

images:
  - name: docker.io/jacbeekers/dq-made-easy-engine
    newName: docker-registery.host.dev.jac.dot:10443/jacbeekers/dq-made-easy-engine
    newTag: "0.10"
  - name: docker.io/jacbeekers/dq-made-easy-profiling
    newName: docker-registery.host.dev.jac.dot:10443/jacbeekers/dq-made-easy-profiling
    newTag: "0.10"
  - name: docker.io/jacbeekers/dq-made-easy-llm
    newName: docker-registery.host.dev.jac.dot:10443/jacbeekers/dq-made-easy-llm
    newTag: "0.10"
  - name: docker.io/jacbeekers/dq-made-easy-kafka-consumer
    newName: docker-registery.host.dev.jac.dot:10443/jacbeekers/dq-made-easy-kafka-consumer
    newTag: "0.10"
  - name: docker.io/jacbeekers/dq-made-easy-openmetadata-db
    newName: docker-registery.host.dev.jac.dot:10443/jacbeekers/dq-made-easy-openmetadata-db
    newTag: "0.10"
  - name: docker.io/jacbeekers/dq-made-easy-openmetadata
    newName: docker-registery.host.dev.jac.dot:10443/jacbeekers/dq-made-easy-openmetadata-server
    newTag: "0.10"

    newTag: "0.10"