apiVersion: apps/v1
kind: Deployment
metadata:
  name: dq-frontend
  labels:
    app.kubernetes.io/name: dq-frontend
    app.kubernetes.io/part-of: dq-made-easy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dq-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-frontend
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      containers:
        - name: dq-frontend
          image: docker.io/jacbeekers/dq-made-easy-frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 443
              name: https
          envFrom:
            - configMapRef:
                name: dq-common-config
            - configMapRef:
                name: dq-frontend-config
            - secretRef:
                name: dq-frontend-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: https
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dq-frontend
  labels:
    app.kubernetes.io/name: dq-frontend
    app.kubernetes.io/part-of: dq-made-easy
spec:
  selector:
    app.kubernetes.io/name: dq-frontend
  ports:
    - name: https
      port: 443
      targetPort: https
