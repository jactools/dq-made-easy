apiVersion: apps/v1
kind: Deployment
metadata:
  name: dq-api
  labels:
    app.kubernetes.io/name: dq-api
    app.kubernetes.io/part-of: dq-made-easy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dq-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-api
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      volumes:
        - name: api-tls-certs
          secret:
            secretName: dq-dev-tls-cert
      containers:
        - name: dq-api
          image: docker.io/jacbeekers/dq-made-easy-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: dq-common-config
            - configMapRef:
                name: dq-api-config
            - secretRef:
                name: dq-api-secrets
          volumeMounts:
            - name: api-tls-certs
              mountPath: /etc/api/certs
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dq-api
  labels:
    app.kubernetes.io/name: dq-api
    app.kubernetes.io/part-of: dq-made-easy
spec:
  selector:
    app.kubernetes.io/name: dq-api
  ports:
    - name: http
      port: 8000
      targetPort: http
