apiVersion: v1
kind: ServiceAccount
metadata:
  name: dq-keycloak-seed
  labels:
    app.kubernetes.io/part-of: dq-made-easy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dq-keycloak-seed-secrets
  labels:
    app.kubernetes.io/part-of: dq-made-easy
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["keycloak-user-password"]
  verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dq-keycloak-seed-secrets
  labels:
    app.kubernetes.io/part-of: dq-made-easy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dq-keycloak-seed-secrets
subjects:
- kind: ServiceAccount
  name: dq-keycloak-seed
