apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - config/common-config.yaml
  - ingress/frontend.yaml
  - ingress/openmetadata.yaml
  - jobs/db-seed.yaml
  - jobs/api-migrate.yaml
  - jobs/keycloak-seed.yaml
  - jobs/kong-bootstrap.yaml
  # kafka-topics and trino-catalog jobs deferred until platform services are available
  # - jobs/kafka-topics.yaml
  # - jobs/trino-catalog.yaml
  - jobs/openmetadata-seed.yaml

transformers:
  - metadata/labels.yaml
  - metadata/annotations.yaml
