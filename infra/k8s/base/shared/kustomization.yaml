apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - config/common-config.yaml
  - config/keycloak-config.yaml
  - config/kong-config.yaml
  - config/platform-ca-bundle.yaml
  - config/platform-root-ca.yaml
  - ingress/frontend.yaml
  - ingress/openmetadata.yaml
  # Jobs are excluded from ArgoCD sync — they exist as templates for manual trigger via scripts/trigger_jobs.sh

transformers:
  - metadata/labels.yaml
  - metadata/annotations.yaml
