---
# dq-db-secrets — Postgres credentials for dev.
# Dev-only: well-known password, not a real secret.
# Production would use External Secrets Operator or vault injection.
apiVersion: v1
kind: Secret
metadata:
  name: dq-db-secrets
  labels:
    app.kubernetes.io/part-of: dq-made-easy
type: Opaque
stringData:
  POSTGRES_PASSWORD: "dq-dev-password"
