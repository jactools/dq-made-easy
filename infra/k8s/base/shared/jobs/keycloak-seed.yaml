apiVersion: batch/v1
kind: Job
metadata:
  name: dq-job-keycloak-seed
  labels:
    app.kubernetes.io/name: dq-job-keycloak-seed
    app.kubernetes.io/part-of: dq-made-easy
    app.kubernetes.io/component: keycloak-config
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-job-keycloak-seed
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      restartPolicy: Never
      containers:
        - name: keycloak-seed
          image: docker.io/jacbeekers/dq-made-easy-api:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/app/scripts/bootstrap_keycloak.sh"]
          envFrom:
            - configMapRef:
                name: dq-common-config
            - configMapRef:
                name: dq-keycloak-config
            - secretRef:
                name: dq-keycloak-secrets
