apiVersion: batch/v1
kind: Job
metadata:
  name: dq-validation
  labels:
    app.kubernetes.io/part-of: dq-made-easy
    dq.jaccloud.nl/type: validation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      restartPolicy: Never
      containers:
      - name: validate
        image: jacloud.nl/docker/jacbeekers/dq-made-easy-api:0.11
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        - |
          set -ex
          # Setup script structure from flat ConfigMap keys
          WORK=/tmp/repo
          mkdir -p $WORK/scripts/validation $WORK/scripts/supporting/logging $WORK/scripts/supporting/env
          cp /scripts/scripts-validation-validate_user_login_end_to_end.sh $WORK/scripts/validation/validate_user_login_end_to_end.sh
          cp /scripts/scripts-supporting-auth.sh $WORK/scripts/supporting/auth.sh
          cp /scripts/scripts-supporting-logging.sh $WORK/scripts/supporting/logging.sh
          cp /scripts/scripts-supporting-logging-core.sh $WORK/scripts/supporting/logging/core.sh
          cp /scripts/scripts-supporting-root_env_file.sh $WORK/scripts/supporting/root_env_file.sh
          cp /scripts/scripts-supporting-env-selection.sh $WORK/scripts/supporting/env/selection.sh
          cp /scripts/scripts-supporting-cluster_helpers.sh $WORK/scripts/supporting/cluster_helpers.sh
          cp /scripts/scripts-supporting-readiness.sh $WORK/scripts/supporting/readiness.sh
          cp /scripts/scripts-supporting-keycloak_readiness.sh $WORK/scripts/supporting/keycloak_readiness.sh
          cp /scripts/scripts-load_seeded_user_credentials.sh $WORK/scripts/load_seeded_user_credentials.sh
          chmod +x $WORK/scripts/validation/*.sh $WORK/scripts/supporting/*.sh
          chmod +x $WORK/scripts/supporting/logging/*.sh $WORK/scripts/supporting/env/*.sh
          bash $WORK/scripts/validation/validate_user_login_end_to_end.sh
        env:
        - name: ROOT_ENV_FILE
          value: /env/.env.dev.local
        - name: ROOT_DIR
          value: /tmp/repo
        # Seeded user credentials (avoid kubectl dependency in pod)
        - name: KEYCLOAK_JACCLOUD_USERNAME
          value: alice@jaccloud.nl
        - name: KEYCLOAK_JACCLOUD_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: keycloak-user-password
        - name: SMOKE_LOGIN_EMAIL
          value: alice@jaccloud.nl
        - name: SMOKE_LOGIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: keycloak-user-password
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: env
          mountPath: /env
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: dq-validation-scripts
          defaultMode: 0755
      - name: env
        configMap:
          name: dq-env-dev
