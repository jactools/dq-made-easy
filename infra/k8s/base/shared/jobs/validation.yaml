apiVersion: batch/v1
kind: Job
metadata:
  name: dq-validation
  labels:
    app.kubernetes.io/part-of: dq-made-easy
    dq.jaccloud.nl/type: validation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      restartPolicy: Never
      containers:
      - name: validate
        image: jacloud.nl/docker/jacbeekers/dq-made-easy-api:0.11
        imagePullPolicy: IfNotPresent
        command:
        - bash
        - -c
        - |
          # Setup script structure from flat ConfigMap keys
          mkdir -p /repo/scripts/validation /repo/scripts/supporting/logging /repo/scripts/supporting/env
          cp /scripts/scripts-validation-validate_user_login_end_to_end.sh /repo/scripts/validation/validate_user_login_end_to_end.sh
          cp /scripts/scripts-supporting-auth.sh /repo/scripts/supporting/auth.sh
          cp /scripts/scripts-supporting-logging.sh /repo/scripts/supporting/logging.sh
          cp /scripts/scripts-supporting-logging-core.sh /repo/scripts/supporting/logging/core.sh
          cp /scripts/scripts-supporting-root_env_file.sh /repo/scripts/supporting/root_env_file.sh
          cp /scripts/scripts-supporting-env-selection.sh /repo/scripts/supporting/env/selection.sh
          cp /scripts/scripts-supporting-cluster_helpers.sh /repo/scripts/supporting/cluster_helpers.sh
          cp /scripts/scripts-supporting-readiness.sh /repo/scripts/supporting/readiness.sh
          cp /scripts/scripts-supporting-keycloak_readiness.sh /repo/scripts/supporting/keycloak_readiness.sh
          cp /scripts/scripts-load_seeded_user_credentials.sh /repo/scripts/load_seeded_user_credentials.sh
          chmod +x /repo/scripts/validation/*.sh /repo/scripts/supporting/*.sh /repo/scripts/supporting/**/*.sh
          bash /repo/scripts/validation/validate_user_login_end_to_end.sh
        env:
        - name: ROOT_ENV_FILE
          value: /env/.env.dev.local
        - name: ROOT_DIR
          value: /repo
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: env
          mountPath: /env
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: dq-validation-scripts
          defaultMode: 0755
      - name: env
        configMap:
          name: dq-env-dev
