apiVersion: batch/v1
kind: Job
metadata:
  name: dq-job-db-rotate-password
  labels:
    app.kubernetes.io/name: dq-job-db-rotate-password
    app.kubernetes.io/part-of: dq-made-easy
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-job-db-rotate-password
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      restartPolicy: Never
      containers:
        - name: rotate-password
          image: postgres:18
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "Rotating password for user: ${POSTGRES_USER:-postgres}"
              PGPASSWORD="${OLD_PASSWORD}" psql -h "${DB_HOST:-dq-db}" -U "${POSTGRES_USER:-postgres}" -d "${POSTGRES_DB:-dq}" \
                -c "ALTER USER ${POSTGRES_USER:-postgres} WITH PASSWORD '${NEW_PASSWORD}';"
              echo "Password rotated successfully"
          env:
            - name: OLD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dq-db-secrets
                  key: POSTGRES_PASSWORD
            - name: NEW_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dq-db-secrets-rotation
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
