apiVersion: batch/v1
kind: Job
metadata:
  name: dq-job-api-migrate
  labels:
    app.kubernetes.io/name: dq-job-api-migrate
    app.kubernetes.io/part-of: dq-made-easy
    dq.jaccloud.nl/trigger: manual

spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-job-api-migrate
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      restartPolicy: Never
      containers:
        - name: api-migrate
          image: docker.io/jacbeekers/dq-made-easy-api:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-lc"]
          args:
            - |
              # Wait for database to be ready
              echo "Waiting for database..."
              for i in $(seq 1 30); do
                if psql "$DATABASE_URL" -c '\q' >/dev/null 2>&1; then
                  echo "Database is ready"
                  break
                fi
                if [[ $i -eq 30 ]]; then
                  echo "Database not ready after 30 attempts"
                  exit 1
                fi
                sleep 2
              done
              cd /app && python -m alembic -c alembic.ini upgrade heads
          envFrom:
            - configMapRef:
                name: dq-common-config
            - configMapRef:
                name: dq-api-config
            - secretRef:
                name: dq-api-secrets
