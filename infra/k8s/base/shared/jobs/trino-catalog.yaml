apiVersion: batch/v1
kind: Job
metadata:
  name: dq-job-trino-catalog
  labels:
    app.kubernetes.io/name: dq-job-trino-catalog
    app.kubernetes.io/part-of: dq-made-easy
    app.kubernetes.io/component: trino-config
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-job-trino-catalog
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      restartPolicy: Never
      containers:
        - name: trino-catalog
          image: docker.io/trinodb/trino:451
          imagePullPolicy: IfNotPresent
          env:
            - name: TRINO_SERVER
              value: "trino.platform-trino.svc.cluster.local:8080"
          command:
            - /bin/sh
            - -c
            - |
              echo "Connecting to Trino at $TRINO_SERVER"
              # Catalog provisioning is done via the Trino Admin API or CLI.
              # This Job runs once to register DQ-specific catalogs/schemas.
              # Example (uncomment when needed):
              # trino --server "$TRINO_SERVER" -c "CREATE SCHEMA IF NOT EXISTS dq.violations"
              echo "Trino catalog configuration complete"
