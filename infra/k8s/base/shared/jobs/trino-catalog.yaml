apiVersion: batch/v1
kind: Job
metadata:
  name: dq-job-trino-catalog
  labels:
    app.kubernetes.io/name: dq-job-trino-catalog
    app.kubernetes.io/part-of: dq-made-easy
    app.kubernetes.io/component: trino-config
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-job-trino-catalog
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      restartPolicy: Never
      containers:
        - name: trino-catalog
          image: docker.io/jacbeekers/dq-made-easy-trino:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: dq-common-config
            - configMapRef:
                name: dq-trino-config
            - secretRef:
                name: dq-trino-secrets
