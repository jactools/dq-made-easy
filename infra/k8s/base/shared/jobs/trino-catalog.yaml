apiVersion: batch/v1
kind: Job
metadata:
  name: dq-job-trino-catalog
  labels:
    app.kubernetes.io/name: dq-job-trino-catalog
    app.kubernetes.io/part-of: dq-made-easy
    app.kubernetes.io/component: trino-config
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-job-trino-catalog
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      restartPolicy: Never
      containers:
        - name: trino-catalog
          image: docker.io/trinodb/trino:451
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              trino --catalog memory --schema public \
                --server "${TRINO_SERVER:-trino.platform-trino.svc.cluster.local:8080}" \
                -f /app/scripts/catalog.sql
          envFrom:
            - configMapRef:
                name: dq-common-config
            - configMapRef:
                name: dq-trino-config
            - secretRef:
                name: dq-trino-secrets
