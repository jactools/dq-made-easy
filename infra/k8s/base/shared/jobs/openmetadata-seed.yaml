apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/skip: 'true'
  labels:
    app.kubernetes.io/name: dq-job-openmetadata-seed
    app.kubernetes.io/part-of: dq-made-easy
    dq.jaccloud.nl/trigger: manual
  name: dq-job-openmetadata-seed
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-job-openmetadata-seed
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      containers:
      - env:
        - name: SEED_ALL
          value: 'true'
        envFrom:
        - configMapRef:
            name: dq-common-config
        - configMapRef:
            name: dq-openmetadata-server-config
        - secretRef:
            name: dq-openmetadata-server-secrets
        image: docker.io/jacbeekers/dq-made-easy-metadata-configure:0.1.0
        imagePullPolicy: IfNotPresent
        name: openmetadata-seed
      restartPolicy: Never
  ttlSecondsAfterFinished: 3600
