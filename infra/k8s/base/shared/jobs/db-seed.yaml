apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/skip: 'true'
  labels:
    app.kubernetes.io/component: db-seed
    app.kubernetes.io/name: dq-job-db-seed
    app.kubernetes.io/part-of: dq-made-easy
    dq.jaccloud.nl/trigger: manual
  name: dq-job-db-seed
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-job-db-seed
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      containers:
      - command:
        - /bin/bash
        - -c
        - 'export DQ_DB_INTERNAL_URL="postgresql://postgres:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"

          exec /bin/bash /workspace/dq-db/scripts/run_db_seed_container.sh

          '
        env:
        - name: PGHOST
          value: dq-db
        - name: PGPORT
          value: '5432'
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: dq-db-secrets
        - name: PGUSER
          value: postgres
        - name: PGDATABASE
          value: dq
        - name: DATABASE_SCHEMA
          value: dq
        - name: REQUIRE_DATABASE
          value: 'true'
        - name: KEYCLOAK_PUBLIC_URL
          value: https://keycloak.dev.jac.dot:10443
        - name: SSO_INTERNAL_ISSUER_URL
          value: https://keycloak.platform-keycloak.svc.cluster.local:8443/realms/dq-made-easy
        - name: KEYCLOAK_REALM
          value: dq-made-easy
        - name: KEYCLOAK_TOKEN_REALM
          value: master
        - name: KEYCLOAK_SYSTEM_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: KEYCLOAK_ADMIN_PASSWORD
              name: dq-keycloak-secrets
        - name: KEYCLOAK_ADMIN_USER
          value: admin
        - name: KEYCLOAK_ADMIN_PASS
          valueFrom:
            secretKeyRef:
              key: KEYCLOAK_ADMIN_PASSWORD
              name: dq-keycloak-secrets
        - name: CURL_CA_BUNDLE
          value: /etc/ssl/certs/trust/internal-ca-bundle.pem
        - name: SSL_CERT_FILE
          value: /etc/ssl/certs/trust/internal-ca-bundle.pem
        envFrom:
        - configMapRef:
            name: dq-common-config
        - configMapRef:
            name: dq-keycloak-config
        - secretRef:
            name: dq-keycloak-secrets
        image: docker.io/jacbeekers/dq-made-easy-db-seed:0.1.0
        imagePullPolicy: IfNotPresent
        name: db-seed
        volumeMounts:
        - mountPath: /etc/ssl/certs/trust
          name: ca-bundle
          readOnly: true
      restartPolicy: Never
      volumes:
      - configMap:
          items:
          - key: ca-bundle.pem
            path: internal-ca-bundle.pem
          name: dq-platform-ca-bundle
        name: ca-bundle
  ttlSecondsAfterFinished: 3600
