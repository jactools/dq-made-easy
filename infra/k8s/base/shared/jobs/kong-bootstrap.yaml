---
# Kong bootstrap job — creates Kong routes, services, JWT plugins, and ACLs.
# Uses the platform-kong image (has curl, jq, python3).
# Admin password comes from the platform keycloak-admin Secret (projected to dq-dev).
apiVersion: batch/v1
kind: Job
metadata:
  name: dq-job-kong-bootstrap
  labels:
    app.kubernetes.io/name: dq-job-kong-bootstrap
    app.kubernetes.io/component: kong-config
    app.kubernetes.io/part-of: dq-made-easy
    dq.jaccloud.nl/trigger: manual
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-job-kong-bootstrap
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      serviceAccountName: default
      restartPolicy: Never
      containers:
        - name: kong-bootstrap
          image: jacloud.nl/docker/jacbeekers/platform-kong:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["bash", "/scripts/bootstrap_kong.sh"]
          env:
            - name: KEYCLOAK_SYSTEM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: KEYCLOAK_ADMIN_PASSWORD
          envFrom:
            - configMapRef:
                name: dq-kong-config
          volumeMounts:
            - name: platform-ca
              mountPath: /etc/ssl/platform
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: platform-ca
          configMap:
            name: platform-root-ca
        - name: scripts
          configMap:
            name: dq-kong-bootstrap-script
