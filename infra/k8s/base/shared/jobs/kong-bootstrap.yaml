apiVersion: batch/v1
kind: Job
metadata:
  name: dq-job-kong-bootstrap
  labels:
    app.kubernetes.io/name: dq-job-kong-bootstrap
    app.kubernetes.io/part-of: dq-made-easy
    app.kubernetes.io/component: kong-config
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-job-kong-bootstrap
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      restartPolicy: Never
      containers:
        - name: kong-bootstrap
          image: docker.io/jacbeekers/dq-made-easy-api:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/app/scripts/bootstrap_kong.sh"]
          envFrom:
            - configMapRef:
                name: dq-common-config
            - configMapRef:
                name: dq-kong-config
            - configMapRef:
                name: dq-keycloak-config
            - secretRef:
                name: dq-kong-secrets
            - secretRef:
                name: dq-keycloak-secrets
          env:
            - name: KEYCLOAK_SYSTEM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dq-keycloak-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KONG_OTEL_ENDPOINT
              value: http://localhost:4318
            - name: TRUST_PROXY_AUTH
              value: "true"
            - name: CURL_CA_BUNDLE
              value: /etc/ssl/certs/platform-root-ca.pem
          volumeMounts:
            - name: platform-root-ca
              mountPath: /etc/ssl/certs/platform-root-ca.pem
              subPath: rootCA.pem
              readOnly: true
      volumes:
        - name: platform-root-ca
          configMap:
            name: platform-root-ca
