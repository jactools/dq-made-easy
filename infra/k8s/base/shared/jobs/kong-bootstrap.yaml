apiVersion: batch/v1
kind: Job
metadata:
  name: dq-job-kong-bootstrap
  labels:
    app.kubernetes.io/name: dq-job-kong-bootstrap
    app.kubernetes.io/part-of: dq-made-easy
    app.kubernetes.io/component: kong-config
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-job-kong-bootstrap
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      restartPolicy: Never
      containers:
        - name: kong-bootstrap
          image: docker.io/jacbeekers/dq-made-easy-kong:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/app/bootstrap_kong.sh"]
          envFrom:
            - configMapRef:
                name: dq-common-config
            - configMapRef:
                name: dq-kong-config
            - secretRef:
                name: dq-kong-secrets
