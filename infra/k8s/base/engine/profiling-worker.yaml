apiVersion: apps/v1
kind: Deployment
metadata:
  name: dq-profiling
  labels:
    app.kubernetes.io/name: dq-profiling
    app.kubernetes.io/part-of: dq-made-easy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dq-profiling
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-profiling
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      containers:
        - name: dq-profiling
          image: docker.io/jacbeekers/dq-made-easy-profiling:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: metrics
          envFrom:
            - configMapRef:
                name: dq-common-config
            - configMapRef:
                name: dq-profiling-config
            - secretRef:
                name: dq-profiling-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dq-profiling
  labels:
    app.kubernetes.io/name: dq-profiling
    app.kubernetes.io/part-of: dq-made-easy
spec:
  selector:
    app.kubernetes.io/name: dq-profiling
  ports:
    - name: metrics
      port: 8001
      targetPort: metrics
