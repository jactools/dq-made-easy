apiVersion: apps/v1
kind: Deployment
metadata:
  name: dq-llm
  labels:
    app.kubernetes.io/name: dq-llm
    app.kubernetes.io/part-of: dq-made-easy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dq-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-llm
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      containers:
        - name: dq-llm
          image: docker.io/jacbeekers/dq-made-easy-llm:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: dq-common-config
            - configMapRef:
                name: dq-llm-config
            - secretRef:
                name: dq-llm-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dq-llm
  labels:
    app.kubernetes.io/name: dq-llm
    app.kubernetes.io/part-of: dq-made-easy
spec:
  selector:
    app.kubernetes.io/name: dq-llm
  ports:
    - name: http
      port: 8000
      targetPort: http
