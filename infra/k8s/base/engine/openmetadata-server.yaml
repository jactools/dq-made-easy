apiVersion: apps/v1
kind: Deployment
metadata:
  name: dq-openmetadata-server
  labels:
    app.kubernetes.io/name: dq-openmetadata-server
    app.kubernetes.io/part-of: dq-made-easy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dq-openmetadata-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dq-openmetadata-server
        app.kubernetes.io/part-of: dq-made-easy
    spec:
      containers:
        - name: dq-openmetadata-server
          image: docker.io/jacbeekers/dq-made-easy-openmetadata:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8585
              name: https
          envFrom:
            - configMapRef:
                name: dq-common-config
            - configMapRef:
                name: dq-openmetadata-server-config
            - secretRef:
                name: dq-openmetadata-server-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: https
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: https
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dq-openmetadata-server
  labels:
    app.kubernetes.io/name: dq-openmetadata-server
    app.kubernetes.io/part-of: dq-made-easy
spec:
  selector:
    app.kubernetes.io/name: dq-openmetadata-server
  ports:
    - name: https
      port: 8585
      targetPort: https
