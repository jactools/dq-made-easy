# ============================================================================
# OBSERVABILITY: Monitoring and logging stack
#
# Observability container lifecycle managed by platform-foundation.
# dq-made-easy keeps only Grafana provisioning (via API) and Aistor.
# ============================================================================

services:
  # Loki, Prometheus, Tempo, Grafana, OTel Collector, Pushgateway,
  # and container-metrics are managed by platform-foundation/docker-compose/observability.yml.
  #
  # DQ-specific configs are mounted as config files:
  #   volumes:
  #     - ../observability/loki/loki-config.yml:/etc/loki/local-config.yml:ro
  #     - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - ../observability/tempo/tempo-config.yml:/etc/tempo/tempo.yml:ro
  #
  # DQ-specific Grafana dashboards/datasources are provisioned via Grafana API
  # by the grafana-init service (no mounts into platform Grafana).

  grafana-init:
    # Depends on platform Grafana (in platform-foundation/docker-compose/observability.yml).
    # No compose dependency — the init script polls until Grafana is reachable.
    profiles:
      - observability
    image: curlimages/curl:latest
    container_name: dq-made-easy-grafana-init
    environment:
      TZ: UTC
      GRAFANA_HOST: ${GRAFANA_HOST:?GRAFANA_HOST is required}
      GRAFANA_HTTPS_HOST_PORT: ${GRAFANA_HTTPS_HOST_PORT:?GRAFANA_HTTPS_HOST_PORT is required}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      OBSERVABILITY_DASHBOARD_UID: ${OBSERVABILITY_DASHBOARD_UID:?OBSERVABILITY_DASHBOARD_UID is required}
      OBSERVABILITY_DASHBOARD_TITLE: ${OBSERVABILITY_DASHBOARD_TITLE:?OBSERVABILITY_DASHBOARD_TITLE is required}
      CURL_CA_BUNDLE: /etc/grafana-init/mkcert-rootCA.pem
      SSL_CERT_FILE: /etc/grafana-init/mkcert-rootCA.pem
    volumes:
      - ../observability/grafana/grafana-init.sh:/grafana-init/grafana-init.sh:ro
      - ../observability/grafana/provisioning/datasources:/grafana-init/datasources:ro
      - ../observability/grafana/provisioning/dashboards:/grafana-init/dashboards:ro
      - ../tmp/certs/mkcert-rootCA.pem:/etc/grafana-init/mkcert-rootCA.pem:ro
    networks:
      - dq-network
    restart: "no"
    labels:
      monitoring: "false"
    entrypoint:
      - /bin/sh
      - /grafana-init/grafana-init.sh

  aistor:
    profiles:
      - observability
      - aistor
    image: quay.io/minio/aistor/minio:latest
    container_name: dq-made-easy-aistor
    ports:
      - ${AISTOR_API_HOST_BIND:?AISTOR_API_HOST_BIND is required}:${AISTOR_API_HOST_PORT:?AISTOR_API_HOST_PORT is required}:9000
      - ${AISTOR_CONSOLE_HOST_BIND:?AISTOR_CONSOLE_HOST_BIND is required}:${AISTOR_CONSOLE_HOST_PORT:?AISTOR_CONSOLE_HOST_PORT is required}:9001
    environment:
      MINIO_ROOT_USER: ${AISTOR_ROOT_USER:?AISTOR_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${AISTOR_ROOT_PASSWORD:?AISTOR_ROOT_PASSWORD is required}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - aistor_data:/mnt/data
      - ${AISTOR_LICENSE_FILE:?AISTOR_LICENSE_FILE is required}:/minio.license:ro
      - ../tmp/certs/services/aistor:/root/.minio/certs:ro
    command:
      - minio
      - server
      - /mnt/data
      - --certs-dir
      - /root/.minio/certs
      - --console-address
      - :9001
      - --license
      - /minio.license
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - --cacert
        - /root/.minio/certs/CAs/internal-ca-bundle.pem
        - https://localhost:9000/minio/health/live
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      dq-network:
        aliases:
          - minio
    labels:
      monitoring: "false"

volumes:
  aistor_data:
    name: dq-made-easy-aistor-data
